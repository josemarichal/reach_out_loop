name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          pip install --upgrade flet
          flutter doctor -v

      - name: Build APK
        run: |
          flet build apk \
            --project . \
            --product "reach_out_loop" \
            --org "com.josemarichal" \
            --build-number 1 \
            --build-version "1.0.0" \
            --yes
        env:
          FLET_BUILD_NO_PROMPT: "true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reach-out-app-release
          path: build/apk/*.apk
