name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          pip install --upgrade flet
          flutter doctor -v

      - name: Build APK
        run: |
          flet build apk . \
            --product="reachoutloop" \
            --org="com.josemarichal" \
            --build-number=1 \
            --build-version=1.0.0 \
            --verbose \
            --yes \
            --skip-flutter-doctor 2>&1 | tee build.log
        env:
          FLET_BUILD_NO_PROMPT: "true"

      - name: List Build Directory (Debug)
        if: always()
        run: find build -maxdepth 4 || echo "Build directory not found"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reachoutloop
          path: |
            build/**/*.apk
            build.log
