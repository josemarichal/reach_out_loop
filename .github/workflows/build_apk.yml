name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          pip install flet
          flutter doctor

      - name: Build APK
        run: |
          # Use lowercase and underscores for the product name
          yes | flet build apk --project . --product "reach_out_loop" --org "com.josemarichal"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reach-out-app-release
          path: build/apk/*.apk
